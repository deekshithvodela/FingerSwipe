  <meta name="theme-color" content="#0b1617">

  <script>
    // Smart Client-Side Legacy URL Redirects & Anti-Flash Theme Init
    (function() {
      var savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.removeAttribute('data-theme');
      }

      var pathname = window.location.pathname;
      var hash = window.location.hash || "";
      var lower = pathname.toLowerCase();

      // Normalize /docs.html or /DOCS.html -> /docs/
      if (lower.endsWith("/docs.html") || lower.endsWith("docs.html")) {
        var cleanDocs = pathname.replace(/docs\.html$/i, "docs/");
        window.location.replace(cleanDocs + hash);
      } 
      // Normalize /index.html -> /
      else if (lower.endsWith("/index.html") || lower.endsWith("index.html")) {
        var cleanHome = pathname.replace(/index\.html$/i, "");
        window.location.replace(cleanHome + hash);
      }
      // Normalize /docs (missing trailing slash) -> /docs/
      else if (lower.endsWith("/docs")) {
        window.location.replace(pathname + "/" + hash);
      }
    })();
  </script>
