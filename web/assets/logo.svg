<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="swipeGradient" x1="4" y1="16" x2="30" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#176966" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#51ba9a"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="handFill" x1="8" y1="10" x2="38" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#152d30"/>
      <stop offset="100%" stop-color="#0b1617"/>
    </linearGradient>
    <linearGradient id="handBorder" x1="8" y1="8" x2="38" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#51ba9a"/>
      <stop offset="100%" stop-color="#176966"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Top-Left Curved Gesture Swipe Motion Arc -->
  <path d="M7 16 C9 8 18 4 28 5" stroke="url(#swipeGradient)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Sharp Modern Arrowhead -->
  <path d="M24 2.5 L29 5.2 L25 8" fill="url(#swipeGradient)" stroke="url(#swipeGradient)" stroke-width="1" stroke-linejoin="round"/>

  <!-- Motion Accent Whispers -->
  <path d="M5 21 C6.5 17 10 13 14 11" stroke="#51ba9a" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.35"/>

  <!-- Stylized ASL "I Love You" Hand (🤟) with Organic Rounded Strokes -->
  <g fill="url(#handFill)" stroke="url(#handBorder)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- Main Hand Contour (Thumb, Index, Folded Middle & Ring, Pinky, Palm & Wrist) -->
    <path d="M 14 27 
             C 11 27, 7 24.5, 6 20.5 
             C 5.2 17.5, 8.5 16, 11 18.5 
             C 12.8 20.3, 14 22, 14 22 
             L 14 11 
             C 14 8.5, 18 8.5, 18 11 
             L 18 21 
             L 21.5 21 
             L 21.5 17 
             C 21.5 15.5, 24.5 15.5, 24.5 17 
             L 24.5 21 
             L 27.5 21 
             L 27.5 18 
             C 27.5 16.5, 30.5 16.5, 30.5 18 
             L 30.5 21 
             L 31 21 
             L 31 12 
             C 31 9.5, 35 9.5, 35 12 
             L 35 28 
             C 35 34, 30 38, 23 38 
             C 17 38, 14 33, 14 27 Z"/>

    <!-- Folded Middle & Ring Finger Knuckle Creases -->
    <path d="M 21.5 24 C 21.5 26, 24.5 26, 24.5 24" fill="none" stroke="url(#handBorder)" stroke-width="1.8"/>
    <path d="M 27.5 24 C 27.5 26, 30.5 26, 30.5 24" fill="none" stroke="url(#handBorder)" stroke-width="1.8"/>
  </g>

  <!-- Luminous Contact Node Highlights on the 3 Extended Tips -->
  <!-- Thumb Tip -->
  <circle cx="8" cy="19.5" r="1.8" fill="#51ba9a" filter="url(#glow)"/>
  <!-- Index Tip -->
  <circle cx="16" cy="11" r="1.8" fill="#51ba9a" filter="url(#glow)"/>
  <!-- Pinky Tip -->
  <circle cx="33" cy="12" r="1.8" fill="#51ba9a" filter="url(#glow)"/>
</svg>
