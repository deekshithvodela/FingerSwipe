name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install system dependencies
        run: |
          # Use canonical archive mirrors with timeouts to avoid stalled Azure mirrors
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com|http://archive.ubuntu.com|g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          sudo sed -i 's|https://azure\.archive\.ubuntu\.com|https://archive.ubuntu.com|g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=10
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=10 \
            libinput-dev \
            libudev-dev \
            libpipewire-0.3-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build Debian Package (.deb)
        run: |
          chmod +x ./build_deb.sh
          ./build_deb.sh

      - name: Build Universal Linux Package (.tar.gz)
        run: |
          chmod +x ./install/build_universal.sh
          ./install/build_universal.sh

      - name: Generate Checksums
        run: |
          mkdir -p release-artifacts
          cp fingerswipe_*.deb release-artifacts/
          cp dist/*.tar.gz release-artifacts/
          cp dist/*.whl release-artifacts/
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          cd ..

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
